name: Deutsche Autobahn-Geodaten aufbereiten
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 1 * *'
permissions:
  contents: write
concurrency:
  group: motorway-geodata
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Osmium installieren
        run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool
      - name: Geofabrik Deutschland herunterladen
        run: |
          mkdir -p work output
          curl --fail --location --retry 3 --retry-delay 15 --connect-timeout 30 \
            'https://download.geofabrik.de/europe/germany-latest.osm.pbf' -o work/germany.osm.pbf
          test -s work/germany.osm.pbf
      - name: Nur Autobahnlinien filtern
        run: |
          osmium tags-filter work/germany.osm.pbf w/highway=motorway \
            --omit-referenced -o work/motorways.osm.pbf --overwrite
          rm -f work/germany.osm.pbf
      - name: Geometrien als GeoJSONSeq exportieren
        run: |
          osmium export work/motorways.osm.pbf -f geojsonseq \
            -o work/motorways.geojsonseq --overwrite
          rm -f work/motorways.osm.pbf
      - name: Autobahnen nach Referenz aufteilen
        run: python3 scripts/build.py work/motorways.geojsonseq output
      - name: Ergebnis kontrollieren
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('output/manifest.json'))
          assert m['roads_count'] >= 50, 'Unerwartet wenige Autobahnen: Abbruch statt fehlerhafter Veröffentlichung'
          assert m['segments_count'] > 10000, 'Unerwartet wenige Straßenabschnitte'
          print('Autobahnen:', m['roads_count'], 'Segmente:', m['segments_count'])
          PY
      - name: Veröffentlichung aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view autobahn-geodata >/dev/null 2>&1 || \
            gh release create autobahn-geodata --title 'Autobahn-Geodaten' --notes 'Automatisch erzeugte OSM-Autobahnsegmente. ODbL / © OpenStreetMap-Mitwirkende.' --latest
          gh release upload autobahn-geodata output/* --clobber
